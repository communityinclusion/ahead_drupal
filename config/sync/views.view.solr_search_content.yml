          admin_label: ''
          plugin_id: text
          empty: false
          content:
            value: "<div id=\"home_header\"><h1>Campus Disability Resource Database</h1>\r\n\r\n<p>Welcome to the Campus Disability Resource (CEDAR) database! Here you can find disability-related information from degree-granting colleges and universities across the United States. In the future we plan to add trade schools and other non-degree granting institutions.</p>\r\n\r\n<p>Start your search by selecting terms in the navigation bar on the left or typing in the name of a college in the search box. Use the Advanced Search to refine your search further. You can also search by key words if there are specific services or features that are important to you such as academic coaching, tutoring, or mentoring. Be aware that some campuses only provided contact information, while others provided more detailed information. See our <a href=\"/frequently-asked-questions\">FAQ page</a> if you have more questions.</p>\r\n\r\n<p>If you need other assistance, or have questions about disability and higher education in the U.S. contact the <a href=\" https://nccsd.ici.umn.edu/\">National Center for College Students with Disabilities</a> at <a href=\"mailto:NCCSD@ahead.org\">NCCSD@ahead.org</a> - we serve future and current college students with disabilities, family members, teachers, college and university faculty, and other professionals. </p>\r\n\r\n<p>For more general information about colleges and universities in the United States, visit <a href=\"https://nces.ed.gov/collegenavigator/\">College Navigator</a>, run by the U.S. Department of Education.</p>\r\n\r\n<p>– <a href=\"https://www.surveymonkey.com/r/GK7CVL8\">Let us know what you think about the database so we can improve it </a> - thank you! </p></div>"
            format: full_html
          tokenize: false
        area_1:
